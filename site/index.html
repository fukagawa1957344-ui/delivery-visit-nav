<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="配送・訪問先の確認と現場写真をまとめて管理する軽量ナビ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css?v=3">
  <title>配送・訪問ナビ</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">配</span><div><strong>配送・訪問ナビ</strong><small>現場情報をひとつの画面に</small></div></div>
      <button id="themeButton" class="icon-button" aria-label="テーマ切り替え" title="テーマ切り替え">◐</button>
    </header>
    <section class="search-panel" aria-label="目的地検索">
      <form id="searchForm" class="search-row">
        <span class="search-icon">⌕</span><input id="addressInput" type="search" autocomplete="street-address" placeholder="住所・地番・施設名を検索" aria-label="住所を検索">
        <button class="search-button" type="submit">検索</button>
      </form>
      <div id="searchStatus" class="status-line" aria-live="polite">住所を入力して検索してください</div>
      <div id="results" class="results" hidden></div>
    </section>
    <section class="map-wrap" aria-label="地図">
      <div id="map"></div>
      <div class="map-controls">
        <button id="layerButton" class="map-control" type="button">航空写真</button>
        <button id="locateButton" class="map-control round" type="button" aria-label="現在地">◎</button>
      </div>
      <div id="navBanner" class="nav-banner" hidden><strong id="navInstruction">ナビを準備しています</strong><span id="navDistance"></span><button id="stopNavButton" type="button">終了</button></div>
      <div class="attribution">地図：<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap</a>　写真：<a href="https://www.gsi.go.jp/" target="_blank" rel="noreferrer">国土地理院</a></div>
    </section>
    <section class="bottom-panel">
      <div class="destination-card">
        <div class="destination-main"><span class="pin-dot"></span><div><small>目的地</small><strong id="destinationName">未選択</strong></div></div>
        <button id="navigateButton" class="primary-button" type="button" disabled>ナビ開始</button>
      </div>
      <div id="placeDetails" class="place-details" hidden></div>
      <div class="photo-toolbar"><div><strong>現場写真</strong><span id="photoCount" class="count">0</span><small>この端末に保存</small></div><button id="addPhotoButton" type="button" class="secondary-button">＋ 写真を追加</button><input id="photoInput" type="file" accept="image/*" capture="environment" multiple hidden></div>
      <div id="photoList" class="photo-list"><div class="empty-state">場所を選ぶと写真を登録できます</div></div>
      <div id="appMessage" class="app-message" aria-live="polite"></div>
    </section>
  </main>
  <div id="photoModal" class="modal" hidden><button id="closeModal" class="modal-close" aria-label="閉じる">×</button><img id="modalImage" alt="現場写真"><div id="modalCaption"></div></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js?v=3" defer></script>
</body>
</html>
